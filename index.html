<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Image Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Montserrat:wght@800&family=Playfair+Display:wght@800&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f7;--card:#fff;--ink:#1b1e27;--mut:#667085;--line:#d9dde5;--acc:#2f5bea}
@media (prefers-color-scheme:dark){:root{--bg:#14161c;--card:#1d2029;--ink:#eef0f5;--mut:#9aa3b5;--line:#313644;--acc:#6d8cff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);background-image:var(--bgimg,none);background-attachment:fixed;color:var(--ink);transition:color .5s;font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:14px}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
h1{font-size:20px;margin:0 0 2px}
.sub{color:var(--mut);font-size:14px;margin:0}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:10px}
textarea{min-height:90px;resize:vertical}
label{font-size:14px;color:var(--mut);display:block;margin-bottom:4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.canvas-box{max-width:420px;margin:0 auto;border-radius:10px;overflow:hidden;line-height:0;border:1px solid var(--line)}
canvas{width:100%;height:auto;display:block}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:600;padding:12px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:var(--onacc,#fff)}
select option{background:var(--card);color:var(--ink)}
.card{transition:background .5s,border-color .5s}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,textarea:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.info{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);margin:0 0 8px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);margin-top:8px}
.chk input{width:18px;height:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Title Image Maker</h1>
    <p class="sub">Paste your blog post title, download the image, and post it on Facebook or Pinterest.</p>
  </div>

  <div class="card">
    <label for="title">Blog post title</label>
    <textarea id="title" placeholder="Paste your blog post title here"></textarea>
    <div class="row" style="margin-top:10px">
      <div><label for="ratio">Image size</label>
        <select id="ratio"><option value="4:5">4:5 (1600x2000) Facebook + Pinterest</option><option value="2:3">2:3 (1600x2400) Pinterest first</option></select></div>
      <div><label for="font">Font</label>
        <select id="font">
          <option value="Poppins">Poppins</option>
          <option value="Montserrat">Montserrat</option>
          <option value="Playfair Display">Playfair Display</option>
          <option value="Oswald">Oswald</option>
        </select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="case">Text style</label>
        <select id="case"><option value="title">Title Case</option><option value="upper">UPPERCASE</option><option value="asis">As typed</option></select></div>
      <div><label for="align">Alignment</label>
        <select id="align"><option value="center">Center</option><option value="left">Left</option></select></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="size">Font size: <span id="sizeV">Auto</span></label>
        <input type="range" id="size" min="40" max="300" value="150"></div>
      <div><label for="site">Site name (optional)</label>
        <input type="text" id="site" placeholder="example.com"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label for="blogsize">Blog-size image (2nd file)</label>
        <select id="blogsize"><option value="16:9">16:9 (1600x900)</option><option value="1.91:1">1.91:1 (1200x630)</option><option value="3:2">3:2 (1500x1000)</option><option value="off">Off (only 1 image)</option></select></div>
      <div><label for="blogfmt">Blog image format</label>
        <select id="blogfmt"><option value="jpg">JPG</option><option value="webp">WebP (smaller)</option><option value="png">PNG</option></select></div>
    </div>
    <div style="margin-top:10px"><label for="mstyle">Tapped word style</label>
      <select id="mstyle"><option value="text">Text colour</option><option value="marker">Marker highlight</option></select></div>
    <label class="chk"><input type="checkbox" id="fill" checked> Fill each line (lines with fewer words get bigger text)</label>
    <label class="chk"><input type="checkbox" id="auto" checked> Auto-fit text size</label>
    <label class="chk"><input type="checkbox" id="adv" checked> Change design + background after every save</label>
  </div>

  <div class="card">
    <div class="info"><span id="counter"></span><span id="bgid"></span></div>
    <div class="canvas-box"><canvas id="cv" width="1600" height="2000" style="cursor:pointer"></canvas></div>
    <p class="sub" style="margin-top:8px;text-align:center">Tap a word on the image to colour it. Tap again for the next colour (5 colours, then back to normal).</p>
    <div class="btns" style="margin-top:10px">
      <button id="prev">Previous background</button>
      <button id="next">Next background</button>
      <button id="dlp" class="p">Download PNG</button>
      <button id="dlj" class="p">Download JPG</button>
    </div>
    <p class="sub" id="note" style="margin-top:8px"></p>
    <div class="btns" style="margin-top:8px">
      <button id="clr">Clear word colours</button>
      <button id="reset">Reset shuffle</button>
    </div>
  </div>
</div>

<script>
(function(){
let W=1600,H=2000;const N=1200,KEY='titleimg_shuffle_v1',RK='titleimg_ratio_v1';
const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
const $=id=>document.getElementById(id);
function setRatio(v){H=v==='2:3'?2400:2000;cv.height=H}
let rv='4:5';try{rv=localStorage.getItem(RK)||'4:5'}catch(e){}
if(rv!=='2:3')rv='4:5';$('ratio').value=rv;setRatio(rv);

/* ---------- shuffle state (saved in browser) ---------- */
function shuffle(){const a=Array.from({length:N},(_,i)=>i);for(let i=N-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.order)||S.order.length!==N||S.pos<0||S.pos>=N){S={order:shuffle(),pos:0,round:1}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function next(){S.pos++;if(S.pos>=N){const last=S.order[N-1];S.order=shuffle();if(S.order[0]===last){[S.order[0],S.order[1]]=[S.order[1],S.order[0]]}S.pos=0;S.round++}save()}
function prev(){if(S.pos>0){S.pos--;save()}}

/* ---------- seeded random ---------- */
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ---------- color helpers ---------- */
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const mix=(c1,c2,t)=>c1.map((v,i)=>Math.round(v+(c2[i]-v)*t));
function rr(x,y,w,h,rad){ctx.beginPath();ctx.moveTo(x+rad,y);ctx.arcTo(x+w,y,x+w,y+h,rad);ctx.arcTo(x+w,y+h,x,y+h,rad);ctx.arcTo(x,y+h,x,y,rad);ctx.arcTo(x,y,x+w,y,rad);ctx.closePath()}
function glow(cx,cy,rad,color){ctx.save();const b=Math.max(8,Math.min(130,rad*.32));try{ctx.filter=`blur(${Math.round(b)}px)`}catch(e){}ctx.fillStyle=color;ctx.beginPath();ctx.arc(cx,cy,rad,0,6.283);ctx.fill();ctx.restore()}
function heartPath(hx,hy,hs){const t=hs*.3;ctx.beginPath();ctx.moveTo(hx,hy+t);
  ctx.bezierCurveTo(hx,hy,hx-hs/2,hy,hx-hs/2,hy+t);
  ctx.bezierCurveTo(hx-hs/2,hy+(hs+t)/2,hx,hy+(hs+t)/2,hx,hy+hs);
  ctx.bezierCurveTo(hx,hy+(hs+t)/2,hx+hs/2,hy+(hs+t)/2,hx+hs/2,hy+t);
  ctx.bezierCurveTo(hx+hs/2,hy,hx,hy,hx,hy+t);
  ctx.closePath()}
let _noise=null;
function noiseTile(){
  if(_noise)return _noise;
  const n=96,c=document.createElement('canvas');c.width=n;c.height=n;
  const x=c.getContext('2d'),id=x.createImageData(n,n);
  for(let i=0;i<id.data.length;i+=4){const v=128+(Math.random()-.5)*130;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=255}
  x.putImageData(id,0,0);_noise=c;return c;
}

/* ---------- curated palettes, tuned for relationship / dating-psychology content: [bgFrom, bgTo, accent, accent2, textColor] ---------- */
const LIGHT=[
['#fff1f4','#fbdee6','#d6566f','#ffb0c0','#2b0f16'],
['#fdf2f4','#f3dde2','#b85c70','#e8a6b4','#2a1014'],
['#fff7f0','#ffe3cf','#e8773a','#ffbf8f','#2d1608'],
['#fff4f1','#ffdfd6','#ec6a52','#ffab93','#2b140d'],
['#faf3f1','#eeddd9','#b8705f','#e3b3a6','#281411'],
['#f8f4ff','#ebe0fb','#8a5cc9','#cda8f5','#271a3d'],
['#fdf6fb','#f0dcee','#b3539e','#edaedb','#2a0f24'],
['#fff9f2','#f6e6d6','#c99a6b','#e8c79a','#2a2008'],
['#fff3f4','#f6dadf','#a63d52','#e3909f','#280d12'],
['#fdfaf6','#f1e6dc','#c2703d','#e3a97c','#2b2118'],
['#fff5f7','#fde2ea','#e0527a','#ffb3c9','#2d0f1b'],
['#f4f7ff','#dfe6fb','#5b6fd6','#b4c0f5','#14183a'],
['#fff8ec','#fce9c9','#d9822b','#fbc77f','#2e1c06'],
['#f2fbf8','#d9f1ea','#2f9c82','#9fdcc8','#0e2a24']
];
const DARK=[
['#2c0f17','#43151f','#f28a9b','#ffbac4','#ffffff'],
['#1e1534','#2d2050','#b28bfa','#d9c4ff','#ffffff'],
['#1f0f14','#331620','#e0607a','#ffa3b5','#ffffff'],
['#201a18','#302722','#e3a16a','#f0c89a','#ffffff'],
['#241a14','#3a241c','#e8a15c','#f2c28f','#ffffff'],
['#201218','#331c26','#d98fa0','#f0bcc7','#ffffff'],
['#14122b','#241f4d','#ff7eb6','#ffc1dc','#ffffff'],
['#1a1020','#2d1840','#c77dff','#e6bdff','#ffffff'],
['#0f1f26','#173a45','#ff8a80','#ffc1bb','#ffffff']
];

/* ---------- unique recipe per background number ----------
   Every background number gets its own combination of: colour palette x main motif x second motif x layout x accent shape.
   The number is scrambled with a prime so the combination is different for all 1200 backgrounds (never repeats). */
const ALL=LIGHT.concat(DARK),ACC=[0,1,2,3,5,7,8,9,10,11,13],MOTN=24,NLAY=4,TOT=ALL.length*MOTN*MOTN*NLAY*ACC.length;
function recipe(idx){let j=(idx*7919)%TOT;
  const pal=j%ALL.length;j=(j-pal)/ALL.length;
  const prim=j%MOTN;j=(j-prim)/MOTN;
  const sec=j%MOTN;j=(j-sec)/MOTN;
  const lay=j%NLAY;j=(j-lay)/NLAY;
  return{pal:pal,prim:prim,sec:sec,lay:lay,acc:j}}

/* ---------- 24 relationship / dating-psychology motifs (all drawn with code) ----------
   0 heart, 1 heart-in-heart, 2 broken heart, 3 chat bubble, 4 two chats, 5 sparkle, 6 rose petals, 7 linked rings,
   8 love letter, 9 location pin (long distance), 10 cupid arrow, 11 butterfly, 12 flower, 13 moon, 14 linked hearts (distance),
   15 thought bubble, 16 eye (attraction), 17 red flag, 18 phone + heart, 19 clock (time), 20 trust lock, 21 ring, 22 infinity, 23 heartbeat */
function motif(k,x,y,s,rot,col,al,mode){
  const u=Math.min(W,H)/1600,WH='rgba(255,255,255,.85)';
  ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.globalAlpha=al;
  ctx.fillStyle=col;ctx.strokeStyle=col;ctx.lineWidth=Math.max(2,Math.min(s*.07,14*u));ctx.lineCap='round';ctx.lineJoin='round';
  const F=()=>ctx.fill(),S=()=>ctx.stroke(),P=()=>{if(mode!=='s')ctx.fill();if(mode!=='f')ctx.stroke()};
  const el=(cx,cy,rx,ry,a)=>{ctx.moveTo(cx+rx*Math.cos(a),cy+rx*Math.sin(a));ctx.ellipse(cx,cy,rx,ry,a,0,6.283)};
  const sp=(cx,cy,r)=>{ctx.moveTo(cx,cy-r);ctx.quadraticCurveTo(cx,cy,cx+r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy+r);ctx.quadraticCurveTo(cx,cy,cx-r,cy);ctx.quadraticCurveTo(cx,cy,cx,cy-r)};
  switch(k){
    case 0:heartPath(0,-.5*s,s);P();break;
    case 1:heartPath(0,-.5*s,.95*s);S();heartPath(0,-.24*s,.45*s);F();break;
    case 2:{const z=[[0,-.6],[.08,-.32],[-.07,-.1],[.08,.12],[-.06,.34],[0,.6]];
      const half=sd=>{ctx.beginPath();ctx.moveTo(sd*s,-.7*s);z.forEach(p=>ctx.lineTo(p[0]*s,p[1]*s));ctx.lineTo(sd*s,.7*s);ctx.closePath()};
      ctx.save();half(-1);ctx.clip();heartPath(0,-.5*s,s);F();ctx.restore();
      ctx.save();ctx.translate(.06*s,.04*s);ctx.rotate(.1);half(1);ctx.clip();heartPath(0,-.5*s,s);F();ctx.restore();break}
    case 3:rr(-.5*s,-.42*s,s,.7*s,.22*s);F();
      ctx.beginPath();ctx.moveTo(-.3*s,.28*s);ctx.lineTo(-.42*s,.5*s);ctx.lineTo(-.06*s,.28*s);ctx.closePath();F();
      ctx.fillStyle=WH;[-.2,0,.2].forEach(dx=>{ctx.beginPath();ctx.arc(dx*s,-.07*s,.055*s,0,6.283);ctx.fill()});break;
    case 4:rr(-.55*s,-.5*s,.85*s,.55*s,.2*s);F();
      ctx.beginPath();ctx.moveTo(-.4*s,.05*s);ctx.lineTo(-.5*s,.28*s);ctx.lineTo(-.18*s,.05*s);ctx.closePath();F();
      ctx.globalAlpha=al*.6;rr(-.05*s,.1*s,.55*s,.38*s,.15*s);F();
      ctx.beginPath();ctx.moveTo(.3*s,.48*s);ctx.lineTo(.4*s,.64*s);ctx.lineTo(.16*s,.48*s);ctx.closePath();F();break;
    case 5:ctx.beginPath();sp(0,0,.5*s);sp(.42*s,-.38*s,.16*s);sp(-.4*s,.4*s,.12*s);P();break;
    case 6:ctx.beginPath();for(let i=-1;i<=1;i++){ctx.save();ctx.translate(0,.5*s);ctx.rotate(i*.55);ctx.translate(0,-.5*s);
        ctx.moveTo(0,.5*s);ctx.bezierCurveTo(-.4*s,.2*s,-.3*s,-.4*s,0,-.5*s);ctx.bezierCurveTo(.3*s,-.4*s,.4*s,.2*s,0,.5*s);ctx.restore()}F();break;
    case 7:ctx.beginPath();ctx.arc(-.17*s,0,.3*s,0,6.283);ctx.moveTo(.47*s,0);ctx.arc(.17*s,0,.3*s,0,6.283);S();break;
    case 8:rr(-.5*s,-.34*s,s,.68*s,.07*s);F();
      ctx.strokeStyle=WH;ctx.lineWidth=Math.max(2,s*.045);ctx.beginPath();ctx.moveTo(-.46*s,-.3*s);ctx.lineTo(0,.06*s);ctx.lineTo(.46*s,-.3*s);ctx.stroke();
      ctx.fillStyle=WH;heartPath(0,.06*s,.2*s);F();break;
    case 9:ctx.beginPath();ctx.moveTo(0,.5*s);ctx.bezierCurveTo(-.46*s,0,-.34*s,-.46*s,0,-.46*s);ctx.bezierCurveTo(.34*s,-.46*s,.46*s,0,0,.5*s);F();
      ctx.fillStyle=WH;ctx.beginPath();ctx.arc(0,-.17*s,.11*s,0,6.283);ctx.fill();break;
    case 10:ctx.beginPath();ctx.moveTo(-.5*s,.5*s);ctx.lineTo(.3*s,-.3*s);S();
      ctx.beginPath();ctx.moveTo(.5*s,-.5*s);ctx.lineTo(.16*s,-.42*s);ctx.lineTo(.42*s,-.16*s);ctx.closePath();F();
      ctx.beginPath();ctx.moveTo(-.5*s,.5*s);ctx.lineTo(-.5*s,.3*s);ctx.moveTo(-.5*s,.5*s);ctx.lineTo(-.3*s,.5*s);
      ctx.moveTo(-.4*s,.4*s);ctx.lineTo(-.4*s,.2*s);ctx.moveTo(-.4*s,.4*s);ctx.lineTo(-.2*s,.4*s);S();break;
    case 11:ctx.beginPath();el(-.26*s,-.14*s,.27*s,.2*s,-.5);el(.26*s,-.14*s,.27*s,.2*s,.5);el(-.2*s,.2*s,.18*s,.14*s,.5);el(.2*s,.2*s,.18*s,.14*s,-.5);F();
      ctx.beginPath();ctx.moveTo(0,-.3*s);ctx.lineTo(0,.38*s);ctx.moveTo(0,-.3*s);ctx.quadraticCurveTo(-.05*s,-.45*s,-.14*s,-.48*s);
      ctx.moveTo(0,-.3*s);ctx.quadraticCurveTo(.05*s,-.45*s,.14*s,-.48*s);S();break;
    case 12:ctx.beginPath();for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;el(Math.cos(a)*.27*s,Math.sin(a)*.27*s,.17*s,.26*s,a+Math.PI/2)}F();
      ctx.fillStyle=WH;ctx.beginPath();ctx.arc(0,0,.1*s,0,6.283);ctx.fill();break;
    case 13:ctx.beginPath();ctx.rect(-s,-s,2*s,2*s);ctx.moveTo(.57*s,-.06*s);ctx.arc(.2*s,-.06*s,.37*s,0,6.283);
      ctx.save();ctx.clip('evenodd');ctx.beginPath();ctx.arc(0,0,.46*s,0,6.283);F();ctx.restore();break;
    case 14:ctx.beginPath();ctx.arc(-.42*s,.18*s,.09*s,0,6.283);ctx.moveTo(.51*s,.18*s);ctx.arc(.42*s,.18*s,.09*s,0,6.283);F();
      ctx.save();ctx.setLineDash([s*.035,s*.075]);ctx.beginPath();ctx.moveTo(-.42*s,.18*s);ctx.quadraticCurveTo(0,-.55*s,.42*s,.18*s);S();ctx.restore();
      heartPath(0,-.3*s,.2*s);F();break;
    case 15:ctx.beginPath();[[-.24,-.1,.2],[.02,-.2,.25],[.28,-.08,.2],[.04,.05,.22],[-.1,-.02,.2]].forEach(c=>{ctx.moveTo((c[0]+c[2])*s,c[1]*s);ctx.arc(c[0]*s,c[1]*s,c[2]*s,0,6.283)});
      ctx.moveTo(-.21*s,.3*s);ctx.arc(-.28*s,.3*s,.07*s,0,6.283);ctx.moveTo(-.355*s,.44*s);ctx.arc(-.4*s,.44*s,.045*s,0,6.283);F();break;
    case 16:ctx.beginPath();ctx.moveTo(-.5*s,0);ctx.quadraticCurveTo(0,-.6*s,.5*s,0);ctx.quadraticCurveTo(0,.6*s,-.5*s,0);S();
      ctx.beginPath();ctx.arc(0,0,.17*s,0,6.283);F();ctx.fillStyle=WH;ctx.beginPath();ctx.arc(-.05*s,-.05*s,.045*s,0,6.283);ctx.fill();break;
    case 17:ctx.beginPath();ctx.moveTo(-.25*s,-.5*s);ctx.lineTo(-.25*s,.5*s);S();
      ctx.beginPath();ctx.moveTo(-.25*s,-.5*s);ctx.lineTo(.45*s,-.3*s);ctx.lineTo(-.25*s,-.08*s);ctx.closePath();F();break;
    case 18:rr(-.25*s,-.5*s,.5*s,s,.1*s);S();ctx.beginPath();ctx.moveTo(-.07*s,-.4*s);ctx.lineTo(.07*s,-.4*s);S();heartPath(0,-.12*s,.26*s);F();break;
    case 19:ctx.beginPath();ctx.arc(0,0,.46*s,0,6.283);S();ctx.beginPath();ctx.moveTo(0,-.28*s);ctx.lineTo(0,0);ctx.lineTo(.2*s,.1*s);S();
      ctx.beginPath();ctx.arc(0,0,.04*s,0,6.283);F();break;
    case 20:rr(-.3*s,-.02*s,.6*s,.46*s,.08*s);F();
      ctx.beginPath();ctx.moveTo(-.18*s,-.02*s);ctx.lineTo(-.18*s,-.18*s);ctx.arc(0,-.18*s,.18*s,Math.PI,0);ctx.lineTo(.18*s,-.02*s);S();
      ctx.fillStyle=WH;heartPath(0,.12*s,.18*s);F();break;
    case 21:ctx.beginPath();ctx.arc(0,.17*s,.3*s,0,6.283);S();
      ctx.beginPath();ctx.moveTo(-.14*s,-.4*s);ctx.lineTo(.14*s,-.4*s);ctx.lineTo(.24*s,-.26*s);ctx.lineTo(0,-.1*s);ctx.lineTo(-.24*s,-.26*s);ctx.closePath();F();break;
    case 22:ctx.beginPath();for(let i=0;i<=60;i++){const t=i/60*6.2832,d=1+Math.sin(t)*Math.sin(t),px=.5*s*Math.cos(t)/d,py=.5*s*Math.sin(t)*Math.cos(t)/d*1.6;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}S();break;
    case 23:ctx.beginPath();[[-.5,0],[-.22,0],[-.14,-.18],[-.06,.3],[.04,-.4],[.12,.12],[.18,0],[.5,0]].forEach((p,i)=>i?ctx.lineTo(p[0]*s,p[1]*s):ctx.moveTo(p[0]*s,p[1]*s));S();break;
  }
  ctx.restore();
}

/* ---------- background: curated gradient + soft shapes + grain + vignette ---------- */
function drawBg(idx){
  const sc=Math.min(W,H)/1600;
  const r=mb(idx*7919+12345),rc=recipe(idx),p=ALL[rc.pal],dk=rc.pal>=LIGHT.length;
  /* small colour drift so even the same palette never looks identical twice */
  const jit=(c,a)=>c.map(v=>Math.max(0,Math.min(255,Math.round(v+(r()-.5)*a))));
  const rgbA=jit(hex2rgb(p[0]),16),rgbB=jit(hex2rgb(p[1]),16),rgbAcc=jit(hex2rgb(p[2]),30),rgbAcc2=jit(hex2rgb(p[3]),30),ink=p[4];

  ctx.save();
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;try{ctx.filter='none'}catch(e){}

  /* multi-stop gradient with a gentle hue drift through the middle */
  const ang=Math.PI/2+(r()-.5)*1.3,l=Math.hypot(W,H)/2,gx=Math.cos(ang)*l,gy=Math.sin(ang)*l;
  const g=ctx.createLinearGradient(W/2-gx,H/2-gy,W/2+gx,H/2+gy);
  let mid=mix(rgbA,rgbB,.52);mid=mix(mid,rgbAcc,.1+r()*.08);
  g.addColorStop(0,rgba(rgbA,1));g.addColorStop(.5,rgba(mid,1));g.addColorStop(1,rgba(rgbB,1));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  const fl=r()<.5,top=r()<.5,type=ACC[rc.acc];
  switch(type){
    case 0:{const R1=(260+r()*140)*sc,R2=(220+r()*120)*sc;
      glow(fl?W*.08:W*.92,top?H*.1:H*.9,R1,rgba(rgbAcc,.5));
      glow(fl?W*.92:W*.08,top?H*.85:H*.15,R2,rgba(rgbAcc2,.4));break}
    case 1:{const R=(360+r()*160)*sc;glow(fl?W*.78:W*.22,top?H*.22:H*.78,R,rgba(rgbAcc,.42));break}
    case 2:{const t=(260+r()*120)*sc,y=top?0:H-t,b=ctx.createLinearGradient(0,top?t:H-t,0,top?0:H);
      b.addColorStop(0,'rgba(0,0,0,0)');b.addColorStop(1,rgba(rgbAcc,.28));
      ctx.fillStyle=b;ctx.fillRect(0,y,W,t);break}
    case 3:{const w=(220+r()*120)*sc,x=fl?0:W-w,b=ctx.createLinearGradient(fl?0:W,0,fl?w:W-w,0);
      b.addColorStop(0,rgba(rgbAcc,.26));b.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=b;ctx.fillRect(x,0,w,H);break}
    case 4:{const gap=46*sc,R=3*sc,x0=fl?W*.07:W*.72,y0=top?H*.07:H*.8;
      ctx.fillStyle=rgba(rgbAcc,.4);
      for(let i=0;i<6;i++)for(let j=0;j<6;j++){ctx.beginPath();ctx.arc(x0+i*gap,y0+j*gap,R,0,6.283);ctx.fill()}break}
    case 5:{const m=(70+r()*20)*sc;ctx.strokeStyle=rgba(rgbAcc,.55);ctx.lineWidth=3*sc;rr(m,m,W-2*m,H-2*m,24*sc);ctx.stroke();break}
    case 6:{const s=(300+r()*80)*sc,X=fl?0:W,Y=top?0:H,sx=fl?s:-s,sy=top?s:-s;
      ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X+sx,Y);ctx.lineTo(X,Y+sy);ctx.closePath();
      ctx.fillStyle=rgba(rgbAcc2,.5);ctx.fill();break}
    case 7:{const amp=(40+r()*20)*sc,off=(120+r()*40)*sc;ctx.beginPath();
      if(top){ctx.moveTo(0,off);ctx.bezierCurveTo(W*.25,off-amp,W*.75,off+amp,W,off);ctx.lineTo(W,0);ctx.lineTo(0,0)}
      else{const base=H-off;ctx.moveTo(0,base);ctx.bezierCurveTo(W*.25,base-amp,W*.75,base+amp,W,base);ctx.lineTo(W,H);ctx.lineTo(0,H)}
      ctx.closePath();ctx.fillStyle=rgba(rgbAcc,.3);ctx.fill();break}
    case 8:{const ccx=fl?W*.1:W*.9,ccy=top?H*.15:H*.85;ctx.strokeStyle=rgba(rgbAcc,.4);ctx.lineWidth=2.5*sc;
      [1,1.6,2.2].forEach(m=>{ctx.beginPath();ctx.arc(ccx,ccy,70*sc*m,0,6.283);ctx.stroke()});break}
    case 9:{const m=90*sc,len=110*sc;ctx.strokeStyle=rgba(rgbAcc,.55);ctx.lineWidth=3.5*sc;ctx.lineCap='round';
      ctx.beginPath();ctx.moveTo(m,m+len);ctx.lineTo(m,m);ctx.lineTo(m+len,m);
      ctx.moveTo(W-m,H-m-len);ctx.lineTo(W-m,H-m);ctx.lineTo(W-m-len,H-m);ctx.stroke();
      ctx.fillStyle=rgba(rgbAcc2,.8);ctx.beginPath();ctx.arc(m,m,5*sc,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(W-m,H-m,5*sc,0,6.283);ctx.fill();break}
    case 10:{glow(W/2,H*.42,(520+r()*80)*sc,rgba(rgbAcc,.16));break}
    case 11:{const g2=ctx.createLinearGradient(fl?0:W,0,fl?W:0,H);
      g2.addColorStop(.42,'rgba(0,0,0,0)');g2.addColorStop(1,rgba(rgbAcc,.22));
      ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);break}
    case 12:{const n=10+(r()*6|0);
      for(let i=0;i<n;i++){const edge=r()<.5,x=edge?(r()*W*.2+(fl?0:W*.8)):r()*W,y=edge?r()*H:(r()*H*.18+(top?0:H*.82)),rad=(4+r()*10)*sc;
        ctx.fillStyle=rgba(r()<.5?rgbAcc:rgbAcc2,.35+r()*.25);ctx.beginPath();ctx.arc(x,y,rad,0,6.283);ctx.fill()}break}
    case 13:{const m=90*sc;ctx.strokeStyle=rgba(rgbAcc,.45);ctx.lineWidth=2*sc;
      ctx.beginPath();ctx.moveTo(m,m);ctx.lineTo(W-m,m);ctx.moveTo(m,H-m);ctx.lineTo(W-m,H-m);ctx.stroke();
      ctx.fillStyle=rgba(rgbAcc2,.8);ctx.beginPath();ctx.arc(m,m,4*sc,0,6.283);ctx.fill();ctx.beginPath();ctx.arc(W-m,H-m,4*sc,0,6.283);ctx.fill();break}
  }

  /* relationship / dating-psychology motifs: layout 0 = faint big watermark + scattered, 1 = corner clusters, 2 = top/bottom rows, 3 = side columns */
  const A=rc.prim,B=rc.sec,cols=[rgbAcc,rgbAcc2,mix(rgbAcc,rgbB,.45),mix(rgbAcc,hex2rgb(ink),.25)];
  const cc=()=>rgba(cols[r()*cols.length|0],1),al=()=>dk?.42+r()*.28:.38+r()*.28,md=()=>r()<.45?'s':'f';
  const ex=(x,y)=>{const a=(x-W/2)/(W*.42),b=(y-H/2)/(H*.3);return a*a+b*b<1},placed=[];
  const spot=(s,fn)=>{for(let t=0;t<40;t++){const q=fn();if(!ex(q[0],q[1])&&placed.every(o=>Math.hypot(o.x-q[0],o.y-q[1])>(o.s+s)*.55)){placed.push({x:q[0],y:q[1],s:s});return q}}return null};
  const put=(k,x,y,s)=>motif(k,x,y,s,(r()-.5)*1.1,cc(),al(),md());
  if(rc.lay===0){
    motif(A,W/2,H*(.44+r()*.06),Math.min(W,H)*(.8+r()*.2),(r()-.5)*.6,rgba(rgbAcc,1),dk?.07+r()*.04:.06+r()*.05,md());
    const n=10+(r()*7|0);
    for(let i=0;i<n;i++){const s=(70+r()*110)*sc,q=spot(s,()=>[r()*W,r()*H]);if(q)put(r()<.3?A:B,q[0],q[1],s)}
  }else if(rc.lay===1){
    [[fl?0:W,top?0:H],[fl?W:0,top?H:0]].forEach((c,ci)=>{
      const sx=c[0]?-1:1,sy=c[1]?-1:1;
      put(ci?B:A,c[0]+sx*W*.04,c[1]+sy*H*.03,(250+r()*120)*sc);
      const n=4+(r()*3|0);
      for(let i=0;i<n;i++)put(r()<.5?A:B,c[0]+sx*r()*W*.26,c[1]+sy*r()*H*.17,(80+r()*110)*sc)});
  }else if(rc.lay===2){
    [true,false].forEach(tp=>{const n=5+(r()*4|0);
      for(let i=0;i<n;i++)put((i+(tp?0:1))%2?A:B,(i+.5)/n*W+(r()-.5)*W/n*.3,H*(tp?.065:.935)+(r()-.5)*H*.02,(70+r()*60)*sc)});
  }else{
    [true,false].forEach(lf=>{const n=4+(r()*3|0);
      for(let i=0;i<n;i++)put((i+(lf?0:1))%2?A:B,W*(lf?.055:.945)+(r()-.5)*W*.02,(i+.5)/n*H+(r()-.5)*H/n*.3,(80+r()*80)*sc)});
  }
  /* tiny sparkle dust outside the text area */
  const sn=5+(r()*6|0);
  for(let i=0;i<sn;i++){const s=(20+r()*26)*sc,q=spot(s,()=>[r()*W,r()*H]);if(q)motif(5,q[0],q[1],s,r()*1.5,cc(),.45+r()*.3,'f')}

  /* fine grain for a premium, non-flat finish */
  ctx.save();ctx.globalAlpha=.05;ctx.globalCompositeOperation='overlay';
  try{ctx.fillStyle=ctx.createPattern(noiseTile(),'repeat');ctx.fillRect(0,0,W,H)}catch(e){}

  const vig=ctx.createRadialGradient(W/2,H*.46,Math.min(W,H)*.15,W/2,H*.5,Math.max(W,H)*.75);
  vig.addColorStop(0,'rgba(0,0,0,0)');vig.addColorStop(1,dk?'rgba(0,0,0,.34)':'rgba(0,0,0,.14)');

  return {color:ink,dark:dk,accent:rgba(rgbAcc,1),accentText:rgba(accTxt,1),pal:pal};
}

/* ---------- text ---------- */
const FALL={'Poppins':'"Poppins"','Montserrat':'"Montserrat"','Playfair Display':'"Playfair Display"','Oswald':'"Oswald"'};
function family(){return (FALL[$('font').value]||'"Poppins"')+',"Segoe UI",Arial,sans-serif'}
/* words the user tapped on the image: word number -> colour number (1..5) */
const picked=new Map(),PALN=5;let hits=[];
function lum(c){const v=c[0]==='#'?hex2rgb(c):c.match(/\d+/g).map(Number);return(.299*v[0]+.587*v[1]+.114*v[2])/255}
/* splits the title into balanced lines (no lonely last word); each word keeps its number so taps can be matched */
function wrapWords(text,maxW){const out=[];let n=0;const sp=ctx.measureText(' ').width;
  text.split(/\n/).forEach(p=>{
    const ws=p.trim().split(/\s+/).filter(Boolean).map(t=>({t:t,i:n++,w:ctx.measureText(t).width})),L=ws.length;if(!L)return;
    const best=new Array(L+1).fill(Infinity),from=new Array(L+1).fill(0);best[0]=0;
    for(let i=1;i<=L;i++){let w=0;
      for(let j=i-1;j>=0;j--){
        w+=ws[j].w+(j<i-1?sp:0);
        if(j<i-1&&w>maxW)break;
        const s=Math.max(0,(maxW-w)/maxW),c=best[j]+.12+s*s*(i===L?.6:1)+(w>maxW?((w-maxW)/maxW)*3:0);
        if(c<best[i]){best[i]=c;from[i]=j}}}
    const rs=[];for(let i=L;i>0;i=from[i])rs.unshift([from[i],i]);
    rs.forEach(r=>out.push(ws.slice(r[0],r[1])))});
  return out}
function getText(){let t=$('title').value.trim();const tc=$('case').value;
  if(tc==='upper')t=t.toUpperCase();else if(tc==='title')t=t.replace(/(^|[\s\-:(])([a-z])/g,(m,a,b)=>a+b.toUpperCase());return t}

/* draws background + title on the current ctx/W/H (works for any size) */
function paint(idx,text){
  const sc=Math.min(W,H)/1600,land=W>H,al=$('align').value,auto=$('auto').checked;
  const maxW=land?W*.78:1240,maxH=land?H*.62:1400,x0=land?W*.11:180;
  const bg=drawBg(idx),fg=bg.color;
  const fill=$('fill').checked,m=Math.min(W,H),maxSz=m*.26;
  /* lay out at a base size; with "fill each line" a line with few words is scaled up (max 1.3x) to use the width */
  function layout(sz){
    ctx.font=`700 ${sz}px ${family()}`;
    const rows=wrapWords(text,maxW).map(ws=>{
      const w=ctx.measureText(ws.map(x=>x.t).join(' ')).width;
      const f=fill?Math.min(1.3,maxW/w):1,s=Math.min(sz*f,Math.max(sz,maxSz));
      return{ws:ws,s:s,lh:s*1.3}});
    return{rows:rows,total:rows.reduce((a,r)=>a+r.lh,0)};
  }
  let size=auto?Math.round(m*.162):Math.round(+$('size').value*sc),lay;
  for(;;){lay=layout(size);
    if(!auto||lay.total<=maxH||size<=36*sc)break;size-=Math.max(2,Math.round(4*sc))}
  const total=lay.total,top0=(H-total)/2;

  /* soft spotlight behind the text block so it pops regardless of what's under it */
  if(text){
    ctx.save();
    const spot=ctx.createRadialGradient(W/2,H/2,10*sc,W/2,H/2,Math.min(W,H)*.52);
    spot.addColorStop(0,bg.dark?'rgba(0,0,0,.4)':'rgba(255,255,255,.6)');
    spot.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=spot;ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  ctx.textBaseline='middle';ctx.textAlign=al;
  const main=ctx.canvas===cv,marker=$('mstyle').value==='marker';if(main)hits=[];
  let ly=top0,lastC=top0,lastS=size;
  ctx.save();
  ctx.textAlign='left';
  ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=16*sc;ctx.shadowOffsetY=5*sc;
  lay.rows.forEach(R=>{
    ctx.font=`700 ${R.s}px ${family()}`;
    const spW=ctx.measureText(' ').width,wd=R.ws.map(o=>ctx.measureText(o.t).width),
      lw=wd.reduce((a,b)=>a+b,0)+spW*(R.ws.length-1);
    let x=al==='center'?W/2-lw/2:x0;const yc=ly+R.lh/2-R.s*.1;
    R.ws.forEach((o,k)=>{
      const c=picked.get(o.i);let col=fg;
      if(c){col=bg.pal[c-1];
        if(marker){ctx.save();ctx.shadowColor='transparent';ctx.fillStyle=col;
          const px=R.s*.14,bh=R.s*1.1;rr(x-px,yc-bh/2+R.s*.04,wd[k]+2*px,bh,R.s*.18);ctx.fill();ctx.restore();
          col=lum(col)>.6?'#1b1b1f':'#ffffff'}}
      ctx.fillStyle=col;ctx.fillText(o.t,x,yc);
      if(main)hits.push({i:o.i,x:x-spW/2,y:ly,w:wd[k]+spW,h:R.lh});
      x+=wd[k]+spW});
    lastC=ly+R.lh/2;lastS=R.s;ly+=R.lh});
  ctx.restore();

  if(text){
    const bw=140*sc,bh=8*sc,by=Math.min(lastC+lay.rows[lay.rows.length-1].lh/2+lastS*.55,H-150*sc),bx=al==='center'?W/2-bw/2:x0;
    ctx.save();ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=10*sc;ctx.shadowOffsetY=3*sc;
    ctx.fillStyle=bg.accent;rr(bx,by,bw,bh,bh/2);ctx.fill();ctx.restore();
  }

  const site=$('site').value.trim();
  if(site){ctx.save();ctx.font=`700 ${Math.round(36*sc)}px ${family()}`;ctx.globalAlpha=.85;ctx.textAlign='center';
    ctx.shadowColor='rgba(0,0,0,.3)';ctx.shadowBlur=8*sc;ctx.fillStyle=fg;ctx.fillText(site,W/2,H-70*sc);ctx.restore()}
  return size;
}

/* ---------- page design follows the current background (changes after every save) ---------- */
const css=c=>`rgb(${c[0]},${c[1]},${c[2]})`;
function applyTheme(idx){
  const rc=recipe(idx),p=ALL[rc.pal],dk=rc.pal>=LIGHT.length,r=document.documentElement.style;
  const b0=hex2rgb(p[0]),b1=hex2rgb(p[1]),acc=hex2rgb(p[2]),ink=dk?[255,255,255]:hex2rgb(p[4]);
  const card=dk?mix(b1,[255,255,255],.07):mix([255,255,255],b0,.3),base=dk?b0:b1;
  r.setProperty('--bg',css(b0));
  r.setProperty('--bgimg',`linear-gradient(145deg,${css(b0)},${css(b1)})`);
  r.setProperty('--card',css(card));
  r.setProperty('--ink',css(ink));
  r.setProperty('--mut',css(mix(ink,base,.4)));
  r.setProperty('--line',css(mix(base,ink,.22)));
  r.setProperty('--acc',css(acc));
  r.setProperty('--onacc',(.299*acc[0]+.587*acc[1]+.114*acc[2])/255>.6?'#1b1b1f':'#ffffff');
  document.documentElement.style.colorScheme=dk?'dark':'light';
}

let token=0;
async function render(){
  const my=++token,idx=S.order[S.pos],text=getText();
  applyTheme(idx);
  try{await document.fonts.load('700 60px '+family(),text||'A')}catch(e){}
  if(my!==token)return;
  const size=paint(idx,text);
  $('dlp').disabled=$('dlj').disabled=!text;
  $('sizeV').textContent=$('auto').checked?'Auto ('+size+')':$('size').value;
  $('counter').textContent=`${S.pos+1} / ${N} · Round ${S.round}`;$('bgid').textContent='BG #'+(idx+1);
}

/* ---------- download (social image + optional blog-size image) ---------- */
const BLOG={'16:9':[1600,900],'1.91:1':[1200,630],'3:2':[1500,1000]};
const MIME={png:'image/png',jpg:'image/jpeg',webp:'image/webp'};
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
function withCanvas(c,w,h,fn){const o=[ctx,W,H];ctx=c.getContext('2d');W=w;H=h;try{return fn()}finally{ctx=o[0];W=o[1];H=o[2]}}
function blogCanvas(){const k=$('blogsize').value;if(!BLOG[k])return null;const w=BLOG[k][0],h=BLOG[k][1],c=document.createElement('canvas');
  c.width=w;c.height=h;withCanvas(c,w,h,()=>paint(S.order[S.pos],getText()));return c}
function makeFiles(socialMime){
  const id=S.order[S.pos]+1,sx=socialMime==='image/png'?'png':'jpg',files=[{name:`post-image-${id}-social.${sx}`,canvas:cv,mime:socialMime}];
  const bc=blogCanvas();if(bc){const f=$('blogfmt').value;files.push({name:`post-image-${id}-blog.${f}`,canvas:bc,mime:MIME[f]})}
  return files}
const toBlob=(c,m)=>new Promise(res=>c.toBlob(res,m,.92));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function saveNative(files){
  const P=CAP.Plugins,uris=[],stamp=Date.now();
  for(const f of files){const data=f.canvas.toDataURL(f.mime,.92).split(',')[1];
    const w=await P.Filesystem.writeFile({path:stamp+'-'+f.name,data:data,directory:'CACHE'});uris.push(w.uri)}
  await P.Share.share({title:'Post images',files:uris,dialogTitle:'Share or save images'});
}
async function saveWeb(files){
  for(const f of files){const b=await toBlob(f.canvas,f.mime),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=f.name;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);await wait(500)}
}
async function download(type){
  try{const files=makeFiles(type);if(NATIVE)await saveNative(files);else await saveWeb(files)}
  catch(e){const m=String(e&&e.message||e);if(!/cancel/i.test(m))alert('Download failed: '+m);return}
  if($('adv').checked){next();render()}
}
function note(){const k=$('blogsize').value;$('note').textContent=BLOG[k]?`Each tap saves 2 images: social (${$('ratio').value}) + blog (${k}).`:'Each tap saves 1 image (social).'}

/* ---------- events ---------- */
let tm;const deb=()=>{clearTimeout(tm);tm=setTimeout(render,200)};
['title','site'].forEach(i=>$(i).addEventListener('input',deb));
$('title').addEventListener('input',()=>picked.clear());
['font','align','auto','case','fill','mstyle'].forEach(i=>$(i).addEventListener('change',render));
cv.addEventListener('click',e=>{
  const r=cv.getBoundingClientRect(),px=(e.clientX-r.left)*cv.width/r.width,py=(e.clientY-r.top)*cv.height/r.height;
  const h=hits.find(b=>px>=b.x&&px<=b.x+b.w&&py>=b.y&&py<=b.y+b.h);
  if(!h)return;const c=(picked.get(h.i)||0)+1;c>PALN?picked.delete(h.i):picked.set(h.i,c);render()});
$('clr').onclick=()=>{picked.clear();render()};
$('size').addEventListener('input',()=>{$('auto').checked=false;deb()});
$('blogsize').addEventListener('change',note);
$('ratio').addEventListener('change',()=>{rv=$('ratio').value;note();try{localStorage.setItem(RK,rv)}catch(e){}setRatio(rv);render()});
$('next').onclick=()=>{next();render()};
$('prev').onclick=()=>{prev();render()};
$('dlp').onclick=()=>download('image/png');
$('dlj').onclick=()=>download('image/jpeg');
$('reset').onclick=()=>{if(confirm('Reset the shuffle? All 1200 backgrounds will be shuffled again from the start.')){S={order:shuffle(),pos:0,round:1};save();render()}};
if(NATIVE){$('dlp').textContent='Share / Save PNG';$('dlj').textContent='Share / Save JPG'}

/* ---------- remember settings (font, style, size, blog image, site name...) ---------- */
const SETK='titleimg_settings_v2',SETIDS=['font','case','align','size','auto','fill','site','blogsize','blogfmt','adv','mstyle'];
function saveSet(){try{const o={};SETIDS.forEach(i=>{const e=$(i);o[i]=e.type==='checkbox'?e.checked:e.value});localStorage.setItem(SETK,JSON.stringify(o))}catch(e){}}
function loadSet(){try{const o=JSON.parse(localStorage.getItem(SETK));if(!o)return;
  SETIDS.forEach(i=>{if(!(i in o))return;const e=$(i);
    if(e.type==='checkbox')e.checked=!!o[i];
    else if(e.tagName==='SELECT'){const old=e.value;e.value=o[i];if(e.selectedIndex<0)e.value=old}
    else e.value=o[i]})}catch(e){}}
SETIDS.forEach(i=>{$(i).addEventListener('input',saveSet);$(i).addEventListener('change',saveSet)});
loadSet();
note();
document.fonts.ready.then(render);render();
})();
</script>
